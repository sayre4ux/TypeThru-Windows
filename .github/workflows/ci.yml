name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check (tests + clean build)
        shell: cmd
        run: scripts\check.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: TypeThru-windows
          path: .build/check/TypeThru.exe
          if-no-files-found: error
